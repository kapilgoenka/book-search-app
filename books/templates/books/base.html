<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Book Search{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        (function() {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        :root {
            --bg: #f6f4ef;
            --paper: #ffffff;
            --ink: #1a1a1a;
            --ink-2: #44443f;
            --ink-3: #76746d;
            --ink-4: #a9a69d;
            --rule: #e6e2d7;
            --rule-2: #efece4;
            --accent: oklch(0.55 0.10 55);
            --focus: oklch(0.55 0.10 55 / 0.25);
        }
        [data-theme="dark"] {
            --bg: #171614;
            --paper: #1e1c1a;
            --ink: #edeae3;
            --ink-2: #b8b4ad;
            --ink-3: #857f78;
            --ink-4: #534f4a;
            --rule: #2c2a27;
            --rule-2: #252320;
            --accent: oklch(0.70 0.10 55);
            --focus: oklch(0.70 0.10 55 / 0.20);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            font-size: 14px;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; text-decoration: none; }

        /* header */
        .top {
            border-bottom: 1px solid var(--rule);
            background: var(--bg);
            position: sticky; top: 0; z-index: 10;
        }
        .top-inner {
            max-width: 1280px; margin: 0 auto;
            padding: 18px 32px;
            display: flex; align-items: center; gap: 24px;
        }
        .brand {
            display: flex; align-items: baseline; gap: 10px;
            font-family: 'Source Serif 4', serif;
            font-weight: 500; font-size: 20px; letter-spacing: -0.01em;
            white-space: nowrap;
        }
        .brand .dot {
            width: 6px; height: 6px; background: var(--accent); border-radius: 50%;
            transform: translateY(-2px); flex-shrink: 0;
        }
        .brand .sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px; text-transform: uppercase;
            letter-spacing: 0.14em; color: var(--ink-3);
            font-weight: 400; margin-left: 6px; transform: translateY(-1px);
        }
        .search-bar {
            flex: 1; max-width: 560px; margin: 0 auto; position: relative;
        }
        .search-bar input {
            width: 100%;
            background: var(--paper);
            border: 1px solid var(--rule);
            border-radius: 2px;
            padding: 10px 14px 10px 38px;
            font: inherit; color: var(--ink); outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .search-bar input:focus {
            border-color: var(--ink-3);
            box-shadow: 0 0 0 3px var(--focus);
        }
        .search-bar svg {
            position: absolute; left: 12px; top: 50%;
            transform: translateY(-50%); color: var(--ink-3);
        }
        .top-meta {
            display: flex; align-items: center; gap: 18px;
            color: var(--ink-3);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; letter-spacing: 0.04em;
            white-space: nowrap;
        }
        .theme-toggle {
            background: none; border: 1px solid var(--rule); border-radius: 2px;
            cursor: pointer; color: var(--ink-3); padding: 6px 8px;
            display: flex; align-items: center; justify-content: center;
            transition: border-color .15s, color .15s;
            flex-shrink: 0;
        }
        .theme-toggle:hover { border-color: var(--ink-3); color: var(--ink); }
        .theme-toggle .icon-sun { display: none; }
        .theme-toggle .icon-moon { display: block; }
        [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
        [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>

<header class="top">
    <div class="top-inner">
        <div class="brand">
            <span class="dot"></span>
            Book Search
            <span class="sub">Catalog&nbsp;&middot;&nbsp;11k titles</span>
        </div>
        <form class="search-bar" method="get" action="{% url 'books:search' %}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
            </svg>
            <input name="q" value="{{ q }}" placeholder="Search by title or author&hellip;">
        </form>
        <div class="top-meta">
            {{ total_results|default:"11,127" }} results
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
            <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>
            </svg>
            <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
        </button>
    </div>
</header>

{% block content %}{% endblock %}

<script>
    document.getElementById('themeToggle').addEventListener('click', function() {
        var html = document.documentElement;
        var isDark = html.getAttribute('data-theme') === 'dark';
        if (isDark) {
            html.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
        } else {
            html.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
        }
    });
</script>

</body>
</html>
